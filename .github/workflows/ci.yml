name: Core verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 core gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --constraint constraints.txt --editable '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify built wheel in a clean environment
        run: |
          python -m venv /tmp/preflight-wheel-check
          /tmp/preflight-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/preflight-wheel-check/bin/preflight version
          /tmp/preflight-wheel-check/bin/preflight --help

      - name: Publish wheel evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: saas-preflight-wheel-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: warn
          retention-days: 14

  browser-report:
    name: Cross-browser report matrix
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser verification dependencies
        run: python -m pip install --constraint constraints.txt --editable '.[browser]'

      - name: Install isolated browser runtimes
        run: python -m playwright install --with-deps chromium firefox

      - name: Verify report at required widths
        run: python scripts/verify_report_browser.py

      - name: Verify local dashboard journey at required widths
        run: python scripts/verify_dashboard_browser.py

      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: preflight-browser-matrix-${{ github.run_id }}
          path: browser-artifacts/
          if-no-files-found: error
          retention-days: 14

  windows-dashboard:
    name: Windows local dashboard gate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --constraint constraints.txt --editable '.[dev]'

      - name: Verify Windows dashboard and CLI
        run: python -m pytest -q tests/test_dashboard.py tests/test_cli.py tests/test_traceability.py

      - name: Verify installed command
        run: |
          preflight version
          preflight dashboard --help

name: Core verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.11 core gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --constraint constraints.txt --editable '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify built wheel in a clean environment
        run: |
          python -m venv /tmp/preflight-wheel-check
          /tmp/preflight-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/preflight-wheel-check/bin/preflight version
          /tmp/preflight-wheel-check/bin/preflight --help

      - name: Publish wheel evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: saas-preflight-wheel-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: warn
          retention-days: 14


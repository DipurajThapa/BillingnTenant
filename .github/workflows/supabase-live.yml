name: Supabase live verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-live.yml"
      - "scripts/verify_supabase_live.py"
      - "src/preflight/supabase_adapter.py"
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: supabase-live-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked verification dependencies
        run: python -m pip install -c constraints.txt "httpx>=0.28,<1"
      - name: Verify authenticated Supabase boundary
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
          SUPABASE_TEST_ACTOR_A_EMAIL: ${{ secrets.SUPABASE_TEST_ACTOR_A_EMAIL }}
          SUPABASE_TEST_ACTOR_A_PASSWORD: ${{ secrets.SUPABASE_TEST_ACTOR_A_PASSWORD }}
          SUPABASE_TEST_ACTOR_B_EMAIL: ${{ secrets.SUPABASE_TEST_ACTOR_B_EMAIL }}
          SUPABASE_TEST_ACTOR_B_PASSWORD: ${{ secrets.SUPABASE_TEST_ACTOR_B_PASSWORD }}
        run: python scripts/verify_supabase_live.py
